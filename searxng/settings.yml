# Minimal SearXNG settings for Kriton's web-search grounding.
# Inherits all upstream defaults, then overrides only what we need:
#   - a secret key (required)
#   - the JSON output format (disabled by default) so the backend can call
#     /search?format=json
use_default_settings: true

server:
  # Long random signing key (generated). Override in cloud via SEARXNG_SECRET env if desired.
  secret_key: "11348529a141fad780ecc2f525d0c2d10c73044de9b23a6efede60bb2a030911"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # Upstream default is 3.0s, which every engine was exceeding under load —
  # the logs showed google/duckduckgo/wikipedia/startpage all timing out at
  # ~3.2s, so a query returned HTTP 200 with an EMPTY result list. The backend
  # cannot tell that apart from "no matches", so answers silently lost their
  # sources. More headroom costs latency only when engines are slow.
  default_lang: "en"
  max_request_timeout: 10.0

# Engines (reviewed 12 Oct 2026 by querying each one directly):
#   - yep: relevant results and honours site: filters (mof.gov.ae for UAE
#     corporate tax, tutorial.gst.gov.in for GSTR-3B). Kept on.
#   - bing: matches only the first word of the query ("cash vs accrual
#     accounting" → Cash App; "UAE corporate tax" → Aadhaar) and returned an
#     adult site for a tax query. Off.
#   - mwmbl, presearch: unrelated pages. Off.
#   - startpage, qwant: serve a CAPTCHA; a SearxEngineCaptchaException once took
#     the container down with exit 255. Off.
#   - brave: "too many requests" within a handful of queries. Off.
#   - mojeek: access denied, no results. Off.
#   - duckduckgo, google cse: rate-limit or CAPTCHA this instance at times but
#     return relevant results when they answer. Left on.
# Tavily (TAVILY_API_KEY) is the primary search; this is the backup.
engines:
  - name: yep
    disabled: false
  - name: bing
    disabled: true
  - name: mwmbl
    disabled: true
  - name: presearch
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: brave
    disabled: true
  - name: mojeek
    disabled: true
