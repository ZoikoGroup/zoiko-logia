services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko -d zoiko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Secrets and provider config come from the same file a local run uses, so
    # there is one source of truth and no keys in version control. Requires
    # backend/.env to exist — copy backend/.env.example and fill it in.
    #
    # IMPORTANT: the values under `environment:` below are container-specific
    # and deliberately stay there. Compose gives `environment:` precedence over
    # `env_file:`, which is what stops the local .env's Supabase DATABASE_URL
    # and its localhost SEARXNG_URL from overriding the services defined here —
    # otherwise `docker compose up` would start postgres and searxng and then
    # quietly talk to production instead.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko@postgres:5432/zoiko
      # Non-superuser role for request-time queries — provisioned automatically
      # by app/main.py's lifespan on startup. Needed for Postgres RLS
      # (sources/source_versions tenant isolation) to actually apply: RLS
      # always exempts superusers, and DATABASE_URL's "zoiko" role is one.
      APP_DATABASE_URL: postgresql+asyncpg://zoiko_app:zoiko_app@postgres:5432/zoiko
      # Service name, not localhost — the searxng service below is reachable on
      # the compose network at its internal port.
      SEARXNG_URL: http://searxng:8080
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:3005"]'
      # Everything else — GROQ_API_KEY, GROQ_MODEL, GROQ_CLASSIFIER_MODEL,
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TWELVE_DATA_API_KEY,
      # ENABLE_ML_CLASSIFIER, FORCE_DIRECT_ANSWER — comes from backend/.env via
      # env_file above. Listing them here with empty defaults would WIN over
      # env_file and blank them out, which is what previously left this stack
      # unable to answer at all.
      #
      # GROQ_MODEL and GROQ_CLASSIFIER_MODEL in particular must be set in
      # backend/.env: the in-code default in groq_adapter.py is a model Groq
      # has since retired, so falling through to it returns HTTP 404
      # "model_not_found" on every request.
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng
    environment:
      # Base URL SearXNG advertises; harmless for internal API use.
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      # Mount a settings dir with the JSON format enabled (see
      # searxng/settings.yml in this repo).
      - ./searxng:/etc/searxng
    ports:
      - "8888:8080"

  seed:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko@postgres:5432/zoiko
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"
    command: >
      sh -c "sleep 5 &&
      python scripts/seed_dev_user.py"

  frontend:
    build: ./frontend
    # Supabase's URL and anon key are read by lib/supabase.ts and the auth
    # pages; without them sign-in fails at runtime. They live in
    # frontend/.env.local (copy frontend/.env.example). Safe to expose — the
    # anon key is public by design; the service role key is backend-only.
    # This works because the image runs `npm run dev`, where Next reads
    # NEXT_PUBLIC_* at runtime. A production `next build` would bake them in at
    # build time instead, and they would need to become build args.
    env_file:
      - ./frontend/.env.local
    environment:
      # Browser-facing, so it must be the host-published port, not the compose
      # service name — this URL is fetched from the user's machine.
      NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
