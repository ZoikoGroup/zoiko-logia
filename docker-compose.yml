services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zoiko
      POSTGRES_PASSWORD: zoiko
      POSTGRES_DB: zoiko
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoiko -d zoiko"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # API keys and provider config. Requires backend/.env — copy .env.example.
    env_file:
      - ./backend/.env
    environment:
      # These four are container-specific and MUST stay under `environment:`,
      # which Compose ranks above `env_file:` — otherwise the local .env's
      # Supabase DATABASE_URL and localhost SEARXNG_URL would win and this
      # stack would start postgres and searxng, then talk to production.
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko@postgres:5432/zoiko
      # Non-superuser role for request-time queries — provisioned automatically
      # by app/main.py's lifespan on startup. Needed for Postgres RLS
      # (sources/source_versions tenant isolation) to actually apply: RLS
      # always exempts superusers, and DATABASE_URL's "zoiko" role is one.
      APP_DATABASE_URL: postgresql+asyncpg://zoiko_app:zoiko_app@postgres:5432/zoiko
      SEARXNG_URL: http://searxng:8080
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:3005"]'
      # Do NOT add GROQ_*/SUPABASE_*/TWELVE_DATA_* here — an empty value would
      # override env_file and blank the real key. GROQ_MODEL and
      # GROQ_CLASSIFIER_MODEL must be set in backend/.env: groq_adapter.py's
      # in-code default is a model Groq has retired, so falling through to it
      # returns 404 "model_not_found" on every request.
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng
    environment:
      # Base URL SearXNG advertises; harmless for internal API use.
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      # Mount a settings dir with the JSON format enabled (see
      # searxng/settings.yml in this repo).
      - ./searxng:/etc/searxng
    ports:
      - "8888:8080"

  seed:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko@postgres:5432/zoiko
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"
    command: >
      sh -c "sleep 5 &&
      python scripts/seed_dev_user.py"

  frontend:
    build: ./frontend
    # Supabase URL + anon key, read by lib/supabase.ts. Requires
    # frontend/.env.local. Works at runtime because the image runs
    # `npm run dev`; a production `next build` would need these as build args.
    env_file:
      - ./frontend/.env.local
    environment:
      # Host-published port, not the service name — the browser fetches this.
      NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
