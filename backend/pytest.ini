[pytest]
testpaths = tests
# The tenant-isolation and licence-gate suites declare bare `async def test_*`
# with no @pytest.mark.asyncio — they predate pytest being a dependency and
# were run standalone via each file's own main(). auto mode runs them under
# pytest without having to annotate every one, and leaves the sync suites
# (routing matrix, answer validator, sec_edgar) untouched.
asyncio_mode = auto
# app/core/database.py builds its async engine at import time, so its asyncpg
# connections are bound to whatever loop was running then. pytest-asyncio's
# default is a fresh loop per test, which closes that loop underneath the
# pooled connections and fails the next test with "Event loop is closed".
# One session-wide loop matches the engine's own lifetime.
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
markers =
    integration: requires an explicitly configured isolated database or external service
    live: makes a request to a live third-party API and is opt-in
