name: Governed backend release

# A candidate must pass unit/build CI, deploy to staging, pass the live gate,
# then deploy the SAME checked-out revision to production. Configure separate
# staging/production GitHub environments and disable direct production
# GitHub autodeploy in Railway so it cannot bypass this workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governed-backend-release
  cancel-in-progress: false

jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    outputs:
      revision: ${{ github.event.workflow_run.head_sha }}
      config_hash: ${{ steps.gate.outputs.config_hash }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_CALLER: skill:use-railway@1.3.6
      RAILWAY_AGENT_SESSION: github-${{ github.run_id }}
      CANDIDATE_REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - name: Require explicitly scoped staging credentials
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_SERVICE_ID"
      - name: Stamp and deploy the candidate to staging
        run: |
          printf '%s\n' "$CANDIDATE_REVISION" > backend/release_revision.txt
          railway up backend --path-as-root --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" -m "Staging $CANDIDATE_REVISION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Evaluate the deployed candidate before production promotion
        id: gate
        working-directory: backend
        env:
          BASELINE_API_URL: ${{ secrets.BASELINE_API_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVAL_EMAIL: ${{ secrets.EVAL_EMAIL }}
          EVAL_PASSWORD: ${{ secrets.EVAL_PASSWORD }}
          EVAL_TENANT_ID: ${{ secrets.EVAL_TENANT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/release_gate.py
          python -c 'import json, os; summary = json.load(open("evals/reports/release-gate-summary.json")); assert summary["eligible"]; open(os.environ["GITHUB_OUTPUT"], "a").write("config_hash=" + summary["config_hash"] + "\n")' 
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-release-gate
          path: |
            backend/evals/reports/release-gate-*.md
            backend/evals/reports/release-gate-summary.json

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_CALLER: skill:use-railway@1.3.6
      RAILWAY_AGENT_SESSION: github-${{ github.run_id }}
      CANDIDATE_REVISION: ${{ needs.staging.outputs.revision }}
      EXPECTED_CONFIG_HASH: ${{ needs.staging.outputs.config_hash }}
      PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.staging.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - name: Require explicitly scoped production credentials
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          test -n "$RAILWAY_SERVICE_ID"
          test -n "$PRODUCTION_API_URL"
      - name: Deploy only the candidate that passed staging
        run: |
          printf '%s\n' "$CANDIDATE_REVISION" > backend/release_revision.txt
          railway up backend --path-as-root --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID" -m "Verified release $CANDIDATE_REVISION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Verify the production revision
        run: python backend/scripts/check_revision.py
