name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Audit installed backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local --strict
      - name: Test backend
        env:
          ENABLE_ML_CLASSIFIER: "false"
          ENABLE_RAG_EMBEDDINGS: "false"
        run: python -m pytest -q

  postgres-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: zoiko-ci-only
          POSTGRES_DB: zoiko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoiko -d zoiko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      RUN_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko-ci-only@localhost:5432/zoiko
      APP_DATABASE_URL: postgresql+asyncpg://zoiko_app:zoiko-app-ci-only@localhost:5432/zoiko
      ENABLE_ML_CLASSIFIER: "false"
      ENABLE_RAG_EMBEDDINGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Provision integration schema and RLS
        run: python scripts/setup_postgres_integration.py
      - name: Verify database-enforced tenant isolation
        run: >-
          python -m pytest -q
          tests/test_tenant_isolation.py
          tests/test_massarius_tenant_scope.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  provider-health:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Probe configured external providers
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PAYROLL_TAX_API_KEY: ${{ secrets.PAYROLL_TAX_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: python scripts/check_external_sources.py
