name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  # So the upstream canary can be run on demand when a source is suspected
  # of having changed, without waiting for the next scheduled run.
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Audit installed backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --local --strict
      - name: Test backend
        env:
          ENABLE_ML_CLASSIFIER: "false"
          ENABLE_RAG_EMBEDDINGS: "false"
        run: python -m pytest -q

  postgres-tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zoiko
          POSTGRES_PASSWORD: zoiko-ci-only
          POSTGRES_DB: zoiko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoiko -d zoiko"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      RUN_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://zoiko:zoiko-ci-only@localhost:5432/zoiko
      APP_DATABASE_URL: postgresql+asyncpg://zoiko_app:zoiko-app-ci-only@localhost:5432/zoiko
      ENABLE_ML_CLASSIFIER: "false"
      ENABLE_RAG_EMBEDDINGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Provision integration schema and RLS
        run: python scripts/setup_postgres_integration.py
      - name: Verify database-enforced tenant isolation
        run: >-
          python -m pytest -q
          tests/test_tenant_isolation.py
          tests/test_massarius_tenant_scope.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Upstream canary. Every other job here mocks its network calls, which is
  # correct — a merge must not fail because a government web server is slow.
  # The cost of that is that nothing else in this workflow would ever notice
  # an upstream quietly changing its contract, so this job exists to talk to
  # the real authorities on a schedule and report what came back.
  provider-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Reports, never blocks. An upstream outage is not a broken commit, and
    # a job that fails the build for one teaches everyone to ignore it.
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      # The previous run's report, so the next step can alert on a CHANGE
      # rather than on a state. Two sources fail persistently for reasons no
      # code change fixes; a job that goes red for those every day is a job
      # everyone learns to ignore. restore-keys picks up the most recent
      # cache under the prefix, so this needs no artifact API access.
      - name: Restore the previous report
        uses: actions/cache/restore@v4
        with:
          path: backend/previous-provider-health.json
          key: provider-health-${{ github.run_id }}
          restore-keys: provider-health-
      - name: Probe configured external providers
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          PAYROLL_TAX_API_KEY: ${{ secrets.PAYROLL_TAX_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
          # Both are free to obtain. Until they are set, Regulations.gov and
          # SAM.gov report "unconfigured" and this run covers two fewer
          # sources — visible in the summary counts, not silently skipped.
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        # --skip-registry: this job has no database, and an absent one is
        # not an upstream fault. Run the registry check where a database
        # exists (locally, or against a deployed environment).
        run: >
          python scripts/check_external_sources.py
          --concurrency 6
          --skip-registry
          --json provider-health.json
      # Red here means "something that was working stopped working today".
      # A known, persistent failure exits 0 and stays quiet.
      - name: Report only what changed
        if: always()
        run: >
          python scripts/diff_provider_health.py
          previous-provider-health.json
          provider-health.json
      - name: Save this report as the next run's baseline
        if: always()
        run: cp provider-health.json previous-provider-health.json
      - name: Persist the baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/previous-provider-health.json
          key: provider-health-${{ github.run_id }}
      - name: Upload the report
        # if: always() — the report is most valuable precisely on the runs
        # where a probe failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-health-${{ github.run_id }}
          path: backend/provider-health.json
          retention-days: 90
